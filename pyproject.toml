[project]
name = "agenticai-billing-kb"
version = "0.1.0"
description = "AI-assisted utility and telecom invoice extraction with local OCR and agentic review."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faiss-cpu==1.14.3",
    "fastapi==0.139.2",
    "google-genai==2.12.1",
    "gradio>=5.50,<7",
    "llama-index-core==0.14.23",
    "llama-index-vector-stores-faiss==0.6.0",
    "ocrmypdf==17.6.0",
    "pillow==12.2.0",
    "pydantic==2.13.4",
    "pymupdf==1.27.2.3",
    "pytesseract==0.3.13",
    "python-dotenv==1.2.2",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
