name: agentic-invoice-parser

x-billing-service: &billing-service
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
  image: ${APP_IMAGE_TAG:-agentic-ai-billing-agent:local}
  user: "${LOCAL_CONTAINER_UID:-1000}:${LOCAL_CONTAINER_GID:-1000}"
  restart: unless-stopped
  environment: &billing-service-environment
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
    JUDGE_MODEL: ${JUDGE_MODEL:-}
    INVOICE_DATA_ROOT: /app/data
    INVOICE_RUNTIME_ROOT: /app/runtime
    RAG_DB_PATH: /app/runtime/knowledge_base.sqlite3
    VECTOR_STORE_DIR: /app/runtime/vector_store
    OCR_LANGUAGES: ${OCR_LANGUAGES:-por+eng}
    OCR_DPI: ${OCR_DPI:-300}
    OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-900}
    OCR_IMAGE_MIN_DIMENSION: ${OCR_IMAGE_MIN_DIMENSION:-1800}
    OCR_IMAGE_MAX_PIXELS: ${OCR_IMAGE_MAX_PIXELS:-24000000}
    OCR_IMAGE_MAX_SCALE: ${OCR_IMAGE_MAX_SCALE:-3.0}
    OMP_THREAD_LIMIT: ${OMP_THREAD_LIMIT:-2}
    HEALTHCHECK_PORT: "8000"
  volumes:
    - ./data:/app/data
    - ./runtime:/app/runtime
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=1g
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  api:
    <<: *billing-service
    container_name: billing-api
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    <<: *billing-service
    container_name: billing-dashboard
    command: ["python", "scripts/dashboard.py", "--host", "0.0.0.0", "--port", "8501"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  gradio:
    <<: *billing-service
    container_name: billing-gradio
    command: ["python", "scripts/gradio_app.py", "--host", "0.0.0.0", "--port", "7860"]
    environment:
      <<: *billing-service-environment
      ALLOW_CONTAINER_BIND: "1"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRADIO_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
