name: agentic-invoice-parser

x-billing-service: &billing-service
  build:
    context: .
    dockerfile: Dockerfile
  image: agentic-ai-billing-agent:local
  restart: unless-stopped
  environment:
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    INVOICE_DATA_ROOT: /app/data
    RAG_KB_PATH: /app/runtime/knowledge_base.json
    VECTOR_STORE_DIR: /app/runtime/vector_store
    HF_HOME: /app/runtime/huggingface
  volumes:
    - ./data:/app/data
    - ./runtime:/app/runtime
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  api:
    <<: *billing-service
    container_name: billing-api
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    <<: *billing-service
    container_name: billing-dashboard
    command: ["python", "scripts/dashboard.py", "--host", "0.0.0.0", "--port", "8501"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
